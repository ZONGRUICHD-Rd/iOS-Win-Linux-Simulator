name: Madeira IPA

# Builds this repository's Madeira fork (madeira/: upstream + patches) into an
# unsigned, ad-hoc signed IPA for sideloading. See madeira/README.md.

on:
  push:
    paths:
      - "madeira/**"
      - ".github/workflows/madeira-ipa.yml"
  workflow_dispatch:

concurrency:
  group: madeira-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-tests:
    # The zip/7z importer is plain C: test it on Linux under ASan before the
    # long macOS build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Madeira tree (app sources only)
        run: |
          git init -q work && cd work
          git remote add origin https://github.com/willfaust/Madeira.git
          git fetch -q --depth 1 origin "$(cat ../madeira/UPSTREAM)"
          git checkout -q FETCH_HEAD
          git -c user.name=ci -c user.email=ci@localhost am -q --3way ../madeira/patches/*.patch
      - name: Build 7-Zip (reference archiver)
        run: |
          curl -sSfL -o 7z-src.tar.xz https://www.7-zip.org/a/7z2501-src.tar.xz
          mkdir 7z && tar -xJf 7z-src.tar.xz -C 7z
          make -C 7z/CPP/7zip/Bundles/Alone2 -j"$(nproc)" -f ../../cmpl_gcc.mak >/dev/null
      - name: Archive importer tests
        run: python3 madeira/tests/archive/test_archive.py work 7z/CPP/7zip/Bundles/Alone2/b/g/7zz

  ipa:
    needs: archive-tests
    runs-on: macos-26
    timeout-minutes: 340
    env:
      MADEIRA: ${{ github.workspace }}/madeira/work/Madeira
      BUNDLE_ID: io.github.zongruichd.madeira
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Prepare Madeira tree
        run: madeira/prepare.sh "$MADEIRA"

      - name: Submodule commits (cache keys)
        id: keys
        run: |
          cd "$MADEIRA"
          echo "fex=$(git rev-parse HEAD:FEX)" >> "$GITHUB_OUTPUT"
          echo "wine=$(git rev-parse HEAD:wine)" >> "$GITHUB_OUTPUT"

      # Each cache is saved as soon as its stage succeeds, so a later failure
      # does not throw away an hour of LLVM.
      - name: Restore LLVM for iOS
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            madeira/work/Madeira/toolchains/llvm-project
            madeira/work/Madeira/toolchains/llvm-ios-build/include
            madeira/work/Madeira/toolchains/llvm-ios-build/lib/*.a
          key: llvm-ios-15.0.7-v1

      - name: Restore toolchains (GnuTLS, FFmpeg, llvm-mingw)
        id: tc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            madeira/work/Madeira/toolchains/gnutls-ios
            madeira/work/Madeira/toolchains/ffmpeg-ios
            madeira/work/Madeira/toolchains/llvm-mingw-*
          key: toolchains-v1-${{ hashFiles('madeira/UPSTREAM') }}

      - name: Restore FEX build
        id: fex-cache
        uses: actions/cache/restore@v4
        with:
          path: madeira/work/Madeira/FEX/build-ios
          key: fex-ios-v1-${{ steps.keys.outputs.fex }}

      - name: Native - tools
        run: madeira/ci/build-native.sh "$MADEIRA" tools

      - name: Native - LLVM 15 for iOS
        id: native-llvm
        run: madeira/ci/build-native.sh "$MADEIRA" llvm
      - name: Save LLVM for iOS
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            madeira/work/Madeira/toolchains/llvm-project
            madeira/work/Madeira/toolchains/llvm-ios-build/include
            madeira/work/Madeira/toolchains/llvm-ios-build/lib/*.a
          key: llvm-ios-15.0.7-v1

      - name: Native - GnuTLS, FFmpeg, Wine configure
        run: madeira/ci/build-native.sh "$MADEIRA" gnutls ffmpeg wine-config
      - name: Save toolchains
        if: steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            madeira/work/Madeira/toolchains/gnutls-ios
            madeira/work/Madeira/toolchains/ffmpeg-ios
            madeira/work/Madeira/toolchains/llvm-mingw-*
          key: toolchains-v1-${{ hashFiles('madeira/UPSTREAM') }}

      - name: Native - FEX
        run: madeira/ci/build-native.sh "$MADEIRA" fex
      - name: Save FEX build
        if: steps.fex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: madeira/work/Madeira/FEX/build-ios
          key: fex-ios-v1-${{ steps.keys.outputs.fex }}

      # Runs even when FEX failed, so one CI run reports both.
      - name: Native - Wine unix side, DXMT, pairing library
        if: ${{ !cancelled() && steps.native-llvm.outcome == 'success' }}
        run: madeira/ci/build-native.sh "$MADEIRA" wine-unix dxmt rppairing extras

      - name: Build app (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project "$MADEIRA/app/Madeira.xcodeproj" -scheme Madeira -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            MADEIRA_BUNDLE_IDENTIFIER="$BUNDLE_ID" DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*Archive|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log" || { grep -B2 -A6 "error:" "$RUNNER_TEMP/xcodebuild.log" | head -200; exit 1; }

      - name: Package IPA (ad-hoc signed with entitlements)
        run: madeira/ci/package-ipa.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphoneos/Madeira.app" "$MADEIRA" Madeira.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-ipa
          path: Madeira.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
